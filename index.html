<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태양광 영업 상담일지</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 로그인 ========== -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-side">
      <div class="logo"><span class="sun"></span><b>SOLAR</b></div>
      <div class="companies">(주)해피솔라 · (주)팜솔라 · (주)스마트솔라</div>
      <h2>영업 상담일지<br><span>통합 대시보드</span></h2>
      <ul>
        <li>전 지사 상담 기록을 한 곳에서 관리</li>
        <li>지사장·관리자 실시간 확인</li>
        <li>영상팀 홍보 성과 피드백 연결</li>
      </ul>
      <div class="branches">본사(광주) · 장흥 · 영암 · 평택 · 파주</div>
    </div>
    <form class="login-form" id="loginForm">
      <h1>로그인</h1>
      <p class="sub">계정 정보를 입력하세요</p>
      <div class="field">
        <label>아이디</label>
        <input id="email" type="text" autocomplete="username" placeholder="예: 장흥 · 관리자 · 영상팀" required>
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn-primary" id="loginBtn" type="submit">로그인</button>
      <div class="login-err" id="loginErr"></div>
      <p class="login-note">아이디는 <b>자기 지사 이름</b>을 입력하세요. (본사·장흥·영암·평택·파주 / 관리자 / 영상팀)</p>
      <div class="login-links">
        <a class="manual-link" href="manual.html" target="_blank">📖 사용 안내</a>
        <a class="manual-link" href="install.html" target="_blank">📱 홈 화면에 추가</a>
      </div>
    </form>
  </div>
</div>

<!-- ========== 앱 ========== -->
<div id="app" class="app">
  <header class="topbar">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="brand"><span class="sun"></span><span class="brand-txt">(주)해피솔라 · (주)팜솔라 · (주)스마트솔라<small>영업 상담일지</small></span></div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="logout" id="logoutBtn">로그아웃</button>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<!-- 설정 미완료 안내 (config.js 미입력 시) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
